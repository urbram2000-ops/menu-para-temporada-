<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#111}
body{font-family:Arial,sans-serif;display:flex;justify-content:center}
.page{width:100%;max-width:960px;position:relative}
.menu{display:block;width:100%;height:auto}

.sheet{position:fixed;inset:0;z-index:20;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.42)}

.panel{position:relative;display:flex;gap:22px;justify-content:center;align-items:center;margin:0 0 24px;padding:16px 20px;border-radius:22px;background:rgba(22,22,22,.96);box-shadow:0 8px 32px rgba(0,0,0,.65)}
.icon{width:62px;height:62px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;text-decoration:none;box-shadow:0 3px 10px rgba(0,0,0,.4)}
.icon svg{width:31px;height:31px;fill:white}
.whatsapp{background:#20b858}
.call{background:#76501f}
.backdrop{position:absolute;inset:0}
@media (min-width:700px){.panel{margin-bottom:30px}}
